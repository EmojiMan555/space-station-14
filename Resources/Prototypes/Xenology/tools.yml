#Tag (Organize these later lol)
- type: Tag
  id: XenoSprayNozzle
- type: Tag
  id: XenoNozzleBackTank
#-------------------------------

- type: entity
  parent: [Clothing, ClothingSlotBase]
  id: ClothingXenovac
  name: Xenovac tank
  description: A backpack tank that stores monkeys sucked up by a Xenovac nozzle. Make your life easier as a xenobiology scientist.
  components:
  - type: Tag
    tags:
    - XenovacBackTank
    - WhitelistChameleon
  - type: Sprite
    sprite: Clothing/Back/Backpacks/waterbackpack.rsi
    state: icon
  - type: Item
    size: Ginormous
  - type: Clothing
    sprite: Clothing/Back/Backpacks/waterbackpack.rsi
    slots:
    - BACK
    - suitStorage
  - type: ItemSlots
    slots:
      item:
        priority: 2
        whitelist:
          tags:
          - XenoSprayNozzle
  - type: ItemMapper
    mapLayers:
      icon-filled:
        whitelist:
          tags:
          - XenoSprayNozzle
  - type: Appearance
  - type: ContainerContainer
    containers:
      item: !type:ContainerSlot
      xenovac_storage: !type:Container
  - type: XenovacTank
    containerId: xenovac_storage
    capacity: 4
  - type: ContainerAmmoProvider
    container: xenovac_storage

- type: entity
  id: WeaponXenovacSprayNozzle
  parent: BaseItem
  name: Xenovac nozzle
  description: A high-powered vacuum nozzle. Click a monkey to suck it into your Xenovac tank, then fire to shoot it back out. Make your life easier as a xenobiology scientist.
  components:
  - type: Tag
    tags:
    - XenoSprayNozzle
  - type: Sprite
    sprite: Objects/Weapons/Guns/Basic/spraynozzle.rsi
    state: icon
  - type: Item
    sprite: Objects/Weapons/Guns/Basic/spraynozzle.rsi
    size: Normal
  - type: XenovacNozzle
    range: 3
    suckDelay: 0.75
    whitelist:
      components:
      - MonkeyAccent
  - type: Gun
    cameraRecoilScalar: 0 #no recoil
    fireRate: 2
    projectileSpeed: 15
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
  - type: Appearance
  #- type: ClothingSlotAmmoProvider
  - type: SlotBasedConnectedContainer
    targetSlot:
    - BACK
    - suitStorage
    containerWhitelist:
      tags:
      - XenovacBackTank
