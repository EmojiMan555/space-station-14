# ============================================================
#  BASE: everything every xeno slime color shares
# ============================================================
- type: entity
  abstract: true                     # abstract = template only, can't be spawned
  parent: MobAdultSlimes
  id: BaseMobXenoSlime
  name: xeno slime
  description: A hungry cute jelly.
  components:
  # Greyscale body + eyes, so each color only needs a tint (see the colors below)
  - type: Sprite
    drawdepth: Mobs
    sprite: Xenobiology/Mobs/xeno_slimes.rsi
    layers:
    - state: eyes_default
      shader: unshaded
      color: "#333333"
    - map: [ "enum.DamageStateVisualLayers.Base" ]
      state: base1
  - type: DamageStateVisuals         # swaps the body sprite when the slime dies
    states:
      Alive:
        Base: base1
      Dead:
        Base: base1_dead
  # Every pet "works" visually. XenoSlimeFriendSystem rolls the real friend chance.
  - type: InteractionPopup
    successChance: 1
  - type: XenoSlime
  - type: XenoSlimeBrain
  - type: XenoSlimeFeeder          # attack / latch / eating-alive settings (Step 5)
  # Vanilla brain OFF. HTN only keeps the "awake" sticker (ActiveNPC) up to date.
  - type: HTN
    rootTask:
      task: SimpleHostileCompound
    enabled: false

# ============================================================
#  COLORS + MUTATION TREE (spec 12.6)
#  "color" tints the whole sprite. "mutations" = what babies can become.
# ============================================================
- type: entity
